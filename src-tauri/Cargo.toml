[package]
name = "git-sync-desktop"
version = "0.1.0"
description = "A desktop sync manager for GitHub and Overleaf"
edition = "2021"

[lib]
name = "git_sync"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
url = "2"
fs2 = "0.4"
tempfile = "3"
wait-timeout = "0.2"
time = "0.3"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
